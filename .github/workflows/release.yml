name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MYCELIUM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MYCELIUM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MYCELIUM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MYCELIUM_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MYCELIUM_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mycelium-release.jks"

      - name: Build signed release APK
        env:
          MYCELIUM_KEYSTORE_PATH: ${{ runner.temp }}/mycelium-release.jks
          MYCELIUM_KEYSTORE_PASSWORD: ${{ secrets.MYCELIUM_KEYSTORE_PASSWORD }}
          MYCELIUM_KEY_ALIAS: ${{ secrets.MYCELIUM_KEY_ALIAS }}
          MYCELIUM_KEY_PASSWORD: ${{ secrets.MYCELIUM_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "mycelium-${GITHUB_REF_NAME}.apk"

      - name: Generate SHA-256
        run: sha256sum "mycelium-${GITHUB_REF_NAME}.apk" > "mycelium-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mycelium-${{ github.ref_name }}.apk
            mycelium-${{ github.ref_name }}.apk.sha256
