name: Android CI

on:
  push:
    branches:
      - main
      - "phase-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The local model engine (llama.cpp + ggml) is compiled from source in this job, so the first
    # run takes much longer than a plain Android build. P2-1b raised this from 20 to 60 minutes;
    # check the first real run and lower it again if there is headroom.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image does not ship NDK 30, CMake 3.22.1 or the compile SDK used here, so they
      # are installed explicitly. Semicolon package names must stay quoted.
      - name: Install NDK, CMake and the compile SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;30.0.16248370" "cmake;3.22.1" "platforms;android-37.0" "build-tools;36.0.0"

      # The same gate as the local check (scripts/check-all.ps1): every module's unit tests, debug
      # and release lint, the debug / release / androidTest packages, and no warnings allowed. The
      # script prepares the pinned llama.cpp source first. --online lets Gradle resolve dependencies
      # on the runner; local runs stay offline.
      - name: Full check (tests, lint, debug/release/androidTest APKs)
        run: bash scripts/check-all.sh --online

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mycelium-verification-reports
          path: |
            build/check-all/
            */build/reports/tests/
            */build/test-results/
            */build/reports/lint-results-*
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mycelium-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
